<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Addons Manager</title>
<!-- « ?i=… » : Edge garde l'icône en cache par adresse ; on change le numéro quand l'icône change -->
<link rel="manifest" href="/manifest.webmanifest?i=3">
<link rel="icon" type="image/png" sizes="512x512" href="/icone-512.png?i=3">
<link rel="icon" type="image/png" sizes="256x256" href="/icone.png?i=3">
<link rel="icon" type="image/svg+xml" href="/icone.svg?i=3">
<meta name="theme-color" content="#0f0d0a">
<style>
  @font-face { font-family: "Barlow Condensed"; src: url("/polices/BarlowCondensed.ttf"); font-display: swap; }
  :root {
    --fond: #0f0d0a; --surface: #17140f; --surface-2: #1d1913; --survol: #221d16; --ligne: #2e271d; --ligne-forte: #4a3c2a;
    --texte: #ece4d6; --doux: #a3967f; --tres-doux: #6f6555; --or: #d9b46a; --or-clair: #f0d79f; --or-fonce: #a8843f;
    --vert: #8fcf7a; --bleu: #8fb7e6; --violet: #c2a6ec; --rouge: #e0806e;
    --titre: "Barlow Condensed", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--or); }
  img { display: block; }

  /* --- En-tête ------------------------------------------------------------ */
  header { position: sticky; top: 0; z-index: 10; background: var(--fond); }
  .tete { display: flex; align-items: center; gap: 14px; padding: 22px 36px 0; }
  .tete > img { width: 40px; height: 40px; flex: none; }
  .titre-appli { min-width: 0; flex: 1 1 auto; }
  .titre-appli .sous > * { flex: none; }
  .titre-appli .sous > #chemin { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tete .droite { flex: none; }
  .titre-appli h1 { margin: 0; font-family: var(--titre); font-weight: 500; font-size: 26px; line-height: 1.05; color: var(--or-clair); white-space: nowrap; }
  .titre-appli .sous { display: flex; align-items: center; gap: 8px; color: var(--tres-doux); font-size: 12.5px; margin-top: 3px; white-space: nowrap; }
  .version { background: none; border: 1px solid var(--ligne); border-radius: 4px; color: var(--doux); font-size: 11.5px; padding: 0 6px; cursor: pointer; }
  .version:hover { color: var(--or); border-color: var(--or-fonce); }
  .tete .droite { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tete .actions { display: flex; align-items: center; gap: 8px; }
  .champ { height: 34px; width: 230px; padding: 0 11px; border: 1px solid var(--ligne); border-radius: 5px; background: var(--surface); outline: none; }
  .champ:focus { border-color: var(--or-fonce); }
  .champ::placeholder { color: var(--tres-doux); }
  .btn { height: 34px; padding: 0 14px; border: 1px solid var(--ligne); border-radius: 5px; background: var(--surface); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { border-color: var(--ligne-forte); background: var(--surface-2); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn.or { background: var(--or); border-color: var(--or); color: #1d150a; font-weight: 600; }
  .btn.or:hover { background: var(--or-clair); }
  .btn { transition: background .15s, border-color .15s, box-shadow .2s, transform .12s; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  /* Jouer : le bleu du bouton de Battle.net, seul à trancher avec le doré de l'appli */
  .btn.jouer { height: 46px; min-width: 168px; padding: 0 28px; justify-content: center; border-radius: 6px; position: relative; overflow: hidden;
    font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .01em;
    background: #1472d8; border-color: #2a86ec;
    box-shadow: 0 6px 22px rgba(20,114,216,.32); }
  .btn.jouer:hover { background: #1c80ec; border-color: #4a9cf3; transform: translateY(-1px);
    box-shadow: 0 10px 30px rgba(28,128,236,.45); }
  .btn.jouer:active:not(:disabled) { transform: translateY(0) scale(.97); }
  .btn.jouer::after { content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%);
    background: linear-gradient(110deg, transparent 35%, rgba(255,250,235,.5) 50%, transparent 65%); animation: reflet 7s ease-in-out 1.5s infinite; }
  @keyframes reflet { 0%, 80% { transform: translateX(-120%); } 95%, 100% { transform: translateX(120%); } }
  .btn.petit { height: 28px; padding: 0 11px; font-size: 13px; }
  .btn.icone { width: 34px; padding: 0; justify-content: center; }
  .bascule { display: inline-flex; align-items: center; gap: 8px; color: var(--doux); font-size: 13px; cursor: pointer; user-select: none; }
  .bascule i { width: 30px; height: 17px; border-radius: 999px; background: #2b261e; position: relative; }
  .bascule i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #8a7f6d; transition: transform .15s; }
  body.compact .bascule i { background: var(--or-fonce); }
  body.compact .bascule i::after { transform: translateX(13px); background: #f4e3bb; }

  .recherche { display: flex; align-items: center; gap: 6px; width: 210px; height: 28px; padding: 0 8px; border: 1px solid var(--ligne); border-radius: 5px; }
  .recherche:hover { border-color: var(--ligne-forte); }
  .recherche:focus-within { background: var(--surface); border-color: var(--or-fonce); }
  .recherche svg { width: 14px; height: 14px; color: var(--tres-doux); flex: none; }
  .recherche input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 13px; }
  .recherche input::placeholder { color: var(--tres-doux); }
  .version-pied { background: none; border: 0; color: var(--tres-doux); font-size: 12px; cursor: pointer; padding: 0 0 0 6px; white-space: nowrap; }
  .version-pied:hover { color: var(--or); }
  .carte, .rang { user-select: none; }
  .onglets { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 18px 36px 0; border-bottom: 1px solid var(--ligne); }
  .onglets button { background: none; border: 0; padding: 0 0 11px; color: var(--doux); font-family: var(--titre); font-size: 17px; cursor: pointer; position: relative; white-space: nowrap; }
  .onglets button:hover { color: var(--texte); }
  .onglets button[aria-selected="true"] { color: var(--or-clair); }
  .onglets button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--or); }
  .onglets .n { margin-left: 5px; font-family: "Segoe UI", sans-serif; font-size: 12px; color: var(--tres-doux); }
  .onglets .n.maj { color: var(--or); font-weight: 600; }
  .onglets .externe span { margin-left: 3px; font-size: 14px; color: var(--tres-doux); }
  .onglets .externe:hover span { color: var(--or); }

  main { padding: 18px 36px 40px; }
  .avis { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 18px; border-left: 3px solid var(--or); background: var(--surface); border-radius: 0 5px 5px 0; }
  .avis b { color: var(--or); font-weight: 600; }
  .avis .btn { margin-left: auto; }
  .avis .btn.avis-premier + .btn { margin-left: 0; }
  .alerte { padding: 10px 14px; margin-bottom: 18px; border-left: 3px solid var(--rouge); background: var(--surface); }
  h2 { font-family: var(--titre); font-weight: 500; font-size: 19px; color: var(--doux); margin: 30px 0 12px; }
  .vide { color: var(--tres-doux); text-align: center; padding: 60px 0; }

  /* --- Cartes -------------------------------------------------------------- */
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
  .carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; min-width: 0; }
  .carte:hover { border-color: var(--ligne-forte); background: var(--surface-2); }
  .absent > * { opacity: .5; transition: opacity .12s; }
  .absent .logo { filter: grayscale(1); }
  .absent:hover > * { opacity: 1; }
  .absent:hover .logo { filter: none; }
  .carte .haut { display: flex; gap: 13px; align-items: center; min-width: 0; }
  .logo { width: 62px; height: 62px; border-radius: 5px; flex: none; object-fit: cover; background: #241f18; }
  .logo-toc { object-fit: contain; padding: 6px; background: radial-gradient(circle at 50% 40%, #2c261d, #1c1813); }
  .rang .logo-toc { padding: 1px; }
  .logo-txt { display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
  .carte h3 { margin: 0; font-family: var(--titre); font-weight: 500; font-size: 20px; line-height: 1.1; color: var(--texte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .carte .titres { min-width: 0; flex: 1; }
  .carte .cat { font-size: 13px; color: var(--doux); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pastilles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .pastille { background: none; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; font-size: 11.5px; line-height: 18px; text-decoration: none; }
  button.pastille { cursor: pointer; }
  button.pastille:hover { background: var(--survol); }
  .carte p { margin: 0; font-size: 13px; color: #c7bcaa; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
  .carte .pied { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 11px; border-top: 1px solid var(--ligne); font-size: 13px; color: var(--doux); min-height: 40px; }
  .carte .pied .droite { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
  .etat-ligne { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etat-ligne .sep { color: var(--tres-doux); }
  .doux { color: var(--tres-doux); }
  .points { width: 28px; height: 28px; border: 0; border-radius: 5px; background: none; color: var(--tres-doux); cursor: pointer; font-size: 17px; line-height: 1; }
  .points:hover { background: var(--survol); color: var(--texte); }

  .st-a_tester { color: var(--bleu); } .st-valide { color: var(--vert); }
  .st-rejete { color: var(--tres-doux); text-decoration: line-through; } .st-perso { color: var(--violet); }
  .ok { color: var(--vert); } .err { color: var(--rouge); } .attention { color: var(--or); }
  .ver b { color: var(--or); font-weight: 600; }

  /* --- Mode compact : tableau --------------------------------------------- */
  .tableau { display: none; }
  body.compact .grille { display: none; }
  body.compact .tableau { display: block; }
  .rang, .rang-tete { display: grid; grid-template-columns: 24px minmax(0, 1fr) 90px 190px 124px 34px; column-gap: 14px; align-items: center; padding: 0 12px; }
  .rang-tete { height: 32px; font-size: 12px; color: var(--tres-doux); border-bottom: 1px solid var(--ligne); }
  .rang { height: 42px; border-bottom: 1px solid #1c1813; cursor: pointer; }
  .rang:hover { background: var(--survol); }
  .rang .logo { width: 22px; height: 22px; border-radius: 4px; font-size: 9px; }
  .rang .nom { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .rang .nom b { font-weight: 600; white-space: nowrap; flex: none; }
  .rang .nom span { color: var(--tres-doux); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rang .ver { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rang .etat-ligne { font-size: 13px; }
  .rang .etat { text-align: right; font-size: 13px; }
  .rang .progres { width: 100%; }
  .rang .nom .note-texte { color: var(--or); }

  /* --- Menus flottants ----------------------------------------------------- */
  .menu { position: fixed; z-index: 40; min-width: 220px; padding: 5px; background: #1f1a14; border: 1px solid var(--ligne-forte); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.55); }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 4px; cursor: pointer; }
  .menu button:hover { background: var(--survol); }
  .menu button.actif::before { content: "✓"; color: var(--or); width: 12px; }
  .menu button.inactif::before { content: ""; width: 12px; }
  .menu hr { border: 0; border-top: 1px solid var(--ligne); margin: 5px 2px; }
  .menu .etiquette { padding: 6px 10px 3px; font-size: 12px; color: var(--tres-doux); }
  .menu .danger { color: var(--rouge); }

  /* --- Fenêtres (dialog) ---------------------------------------------------- */
  dialog { background: var(--surface); color: var(--texte); border: 1px solid var(--ligne-forte); border-radius: 8px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: rgba(5,4,3,.65); }
  dialog form { padding: 22px 24px; display: grid; gap: 13px; }
  dialog h3 { margin: 0 0 2px; font-family: var(--titre); font-weight: 500; font-size: 23px; color: var(--or-clair); }
  label { display: grid; gap: 5px; font-size: 12.5px; color: var(--doux); }
  label input, label select, label textarea { background: var(--fond); border: 1px solid var(--ligne); border-radius: 5px; padding: 8px 10px; color: var(--texte); font-size: 14px; outline: none; }
  label input:focus, label select:focus, label textarea:focus { border-color: var(--or-fonce); }
  textarea { resize: vertical; }
  label.case { display: flex; align-items: center; gap: 8px; color: var(--texte); font-size: 13.5px; cursor: pointer; }
  label.case input { accent-color: var(--or); width: 16px; height: 16px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .pied-fenetre { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .aide { margin: 0; font-size: 13px; color: var(--doux); }
  .journal { max-height: min(60vh, 520px); overflow: auto; }
  .journal h4 { margin: 16px 0 6px; font-family: var(--titre); font-weight: 500; font-size: 19px; color: var(--or); }
  .journal h4 small { font-family: "Segoe UI", sans-serif; font-size: 12.5px; color: var(--tres-doux); margin-left: 8px; }
  .journal ul { margin: 0; padding-left: 18px; color: #d2c8b6; }
  .journal li { margin: 4px 0; }

  #depot { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(15,13,10,.88); border: 2px dashed var(--or); font-family: var(--titre); font-size: 26px; color: var(--or-clair); }
  #depot.actif { display: grid; }
  #toasts { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 40px)); }
  .toast { background: #211c15; border: 1px solid var(--ligne-forte); border-left: 3px solid var(--vert); border-radius: 5px; padding: 10px 14px; white-space: pre-wrap; box-shadow: 0 10px 24px rgba(0,0,0,.5); }
  .toast.erreur { border-left-color: var(--rouge); }
  .toast.info { border-left-color: var(--or); }
  .toast.encours { border-left-color: var(--or); display: flex; align-items: center; gap: 10px; }
  .toast.encours::before { content: ""; flex: none; width: 14px; height: 14px; border: 2px solid var(--ligne-forte); border-top-color: var(--or); border-radius: 50%; animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .toast.encours::before { animation: none; border-color: var(--or); } }

  /* --- Animations légères ------------------------------------------------------ */
  @keyframes monte { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fondu { from { opacity: 0; } }
  @keyframes glisse { from { opacity: 0; transform: translateX(18px); } }
  @keyframes surgit { from { opacity: 0; transform: translateY(-6px) scale(.985); } }
  @keyframes lueur { 50% { box-shadow: 0 0 0 1px rgba(217,180,106,.35), 0 0 22px rgba(217,180,106,.18); } }
  @keyframes battement { 50% { opacity: .55; } }
  /* À l'ouverture et au changement d'onglet seulement (pas à chaque rafraîchissement) */
  .grille.entree .carte { animation: monte .34s cubic-bezier(.2,.7,.3,1) both; }
  .tableau.entree .rang { animation: fondu .3s ease-out both; }
  .carte { transition: border-color .15s, background .15s, transform .18s, box-shadow .18s; }
  .carte:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  /* Une mise à jour qui vient d'arriver : le bandeau descend et s'illumine deux fois */
  .avis.nouveau { animation: surgit .4s cubic-bezier(.2,.7,.3,1) both, lueur 1.4s ease-in-out .4s 2; }
  .onglets .n.maj { animation: battement 2.4s ease-in-out infinite; }
  .toast { animation: glisse .28s cubic-bezier(.2,.7,.3,1); }
  dialog[open] { animation: surgit .22s cubic-bezier(.2,.7,.3,1); }
  dialog[open]::backdrop { animation: fondu .22s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .grille.entree .carte, .tableau.entree .rang, .avis.nouveau, .onglets .n.maj, .toast, dialog[open], dialog[open]::backdrop, .btn.jouer::after { animation: none; }
    .carte:hover, .btn.jouer:hover { transform: none; }
  }

  /* Barre de progression d'une installation */
  .progres { position: relative; display: inline-block; width: 160px; height: 26px; border: 1px solid var(--ligne-forte); border-radius: 5px; overflow: hidden; background: var(--fond); vertical-align: middle; }
  .progres i { position: absolute; inset: 0 auto 0 0; background: var(--or-fonce); opacity: .55; transition: width .25s; }
  .progres span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--texte); }

  /* Filtres par genre et tri */
  .filtres { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; }
  #b-filtre svg { width: 14px; height: 14px; }
  .genre-actif { color: var(--or-clair); border-color: var(--or-fonce); }
  label.tri { display: flex; flex-direction: row; align-items: center; gap: 7px; margin-left: auto; font-size: 13px; color: var(--tres-doux); }
  label.tri select { padding: 4px 8px; font-size: 13px; }

  /* Barre de défilement aux couleurs de l'appli */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--fond); }
  ::-webkit-scrollbar-thumb { background: #3b3226; border-radius: 6px; border: 3px solid var(--fond); }
  ::-webkit-scrollbar-thumb:hover { background: var(--or-fonce); }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-corner { background: var(--fond); }

  /* Info-bulles */
  [data-info] { position: relative; }
  [data-info]::after { content: attr(data-info); position: absolute; top: calc(100% + 7px); right: 0; z-index: 30; padding: 5px 9px;
    background: #2a2419; border: 1px solid var(--ligne-forte); border-radius: 4px; color: var(--texte); font: 400 12.5px "Segoe UI", sans-serif;
    white-space: nowrap; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s .35s, visibility 0s .35s; }
  [data-info]:hover::after, [data-info]:focus-visible::after { opacity: 1; visibility: visible; }
  .info-gauche::after { right: auto; left: 0; }

  /* Notes */
  .note-zone { display: flex; align-items: center; gap: 7px; width: 100%; min-width: 0; padding: 5px 7px; margin: 0 -7px; box-sizing: content-box; background: none; border: 0; border-radius: 5px; color: var(--tres-doux); font-size: 12.5px; text-align: left; cursor: text; }
  .note-zone:hover { background: var(--survol); color: var(--doux); }
  .note-zone.pleine { color: var(--or); }
  .note-zone svg { width: 13px; height: 13px; flex: none; pointer-events: none; }
  .note-zone span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-champ { width: 100%; background: var(--fond); border: 1px solid var(--or-fonce); border-radius: 5px; padding: 6px 8px; font-size: 13px; outline: none; resize: none; }
  .rang-fin { display: flex; justify-content: flex-end; }

  /* Fiche */
  .fiche-desc { margin: 0; font-size: 14px; color: #c7bcaa; line-height: 1.45; }
  /* Nouvelle fiche : bannière aux couleurs du logo, statut en couleur, infos visibles, note en post-it */
  #d-fiche { width: min(600px, calc(100vw - 32px)); overflow-x: hidden; }
  #f-fiche { padding: 0; display: block; }
  .fiche-banniere { --teinte: 35; --sat: 30%; height: 96px; position: relative; border-bottom: 1px solid hsl(var(--teinte) var(--sat) 22%);
    background: radial-gradient(circle at 16% 70%, hsl(var(--teinte) var(--sat) 38% / .75), transparent 60%), hsl(var(--teinte) var(--sat) 11%);
    transition: background .4s, border-color .4s; }
  .fiche-x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 6px; background: rgba(0,0,0,.35); color: #ddd2bf; cursor: pointer; font-size: 14px; }
  .fiche-x:hover { background: rgba(0,0,0,.55); color: #fff; }
  .fiche-tete { display: flex; gap: 16px; align-items: flex-end; padding: 0 24px; margin-top: -44px; position: relative; }
  .fiche-tete .logo { width: 92px; height: 92px; border-radius: 12px; border: 3px solid var(--surface); font-size: 26px; }
  .fiche-tete .logo-toc { padding: 10px; }
  .fiche-titres { min-width: 0; padding-bottom: 3px; }
  .fiche-titres h3 { font-size: 30px; line-height: 1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fiche-puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .puce { padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--doux); font-size: 12px; line-height: 20px; text-decoration: none; }
  .puce.etat-ligne { gap: 5px; }
  .fiche-corps { padding: 20px 24px 18px; display: grid; gap: 16px; }

  .fiche-statut button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 7px; border: 1px solid var(--ligne);
    background: none; color: var(--doux); font-size: 14px; text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .fiche-statut button i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .8; }
  .fiche-statut button:hover { border-color: var(--ligne-forte); color: var(--texte); }
  .fiche-statut .st-a_tester i { background: var(--bleu); } .fiche-statut .st-valide i { background: var(--vert); } .fiche-statut .st-rejete i { background: var(--rouge); }
  .fiche-statut .st-a_tester[aria-pressed="true"] { color: var(--bleu); border-color: var(--bleu); background: #18222e; font-weight: 600; }
  .fiche-statut .st-valide[aria-pressed="true"] { color: var(--vert); border-color: var(--vert); background: #1b2717; font-weight: 600; }
  .fiche-statut .st-rejete[aria-pressed="true"] { color: var(--rouge); border-color: var(--rouge); background: #2c1813; font-weight: 600; }
  .fiche-alerte { padding: 8px 12px; border-left: 3px solid var(--or); background: #221d13; color: var(--or); font-size: 13px; }
  .fiche-cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fiche-cases > div { background: var(--surface-2); border-radius: 7px; padding: 8px 12px; min-width: 0; }
  .fiche-cases small { display: block; font-size: 11.5px; color: var(--tres-doux); margin-bottom: 1px; }
  .fiche-cases span, .fiche-cases a { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .fiche-cases a svg { width: 12px; height: 12px; display: inline; vertical-align: -1px; }
  .fiche-note { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: #221d13; border: 1px solid #3a2f1c; border-left: 3px solid var(--or); border-radius: 0 7px 7px 0; cursor: text; }
  .fiche-note > svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: var(--or); }
  .fiche-note textarea { flex: 1; min-width: 0; background: none; border: 0; padding: 0; resize: none; overflow: hidden; outline: none; color: var(--texte); font-size: 14px; line-height: 1.5; font-family: inherit; }
  .fiche-note textarea::placeholder { color: #8a7a5c; }
  .fiche-note .note-etat { min-height: 0; margin-top: 2px; }
  .fiche-pied { display: flex; align-items: center; gap: 8px; margin: 0 24px; padding: 14px 0 20px; border-top: 1px solid var(--ligne); }
  .fiche-pied .espace { flex: 1; }
  .fiche-pied .btn svg { width: 15px; height: 15px; flex: none; }
  .fiche-pied .btn.discret { padding-left: 4px; color: #c9786a; }
  @media (max-width: 560px) { .fiche-cases { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fiche-pied { flex-wrap: wrap; } }
  .note-etat { font-size: 12px; color: var(--tres-doux); min-height: 16px; }
  .choix { display: grid; gap: 8px; }
  .choix button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; background: none; border: 1px solid var(--ligne-forte); border-radius: 6px; cursor: pointer; }
  .choix button:hover { background: var(--survol); border-color: var(--or-fonce); }
  .choix b { font-weight: 600; font-size: 14.5px; color: var(--texte); }
  .choix .danger b { color: var(--rouge); }
  .choix span { font-size: 12.5px; color: var(--doux); }
  .btn.discret { background: none; border-color: transparent; color: var(--doux); }
  .btn.discret:hover { color: var(--rouge); background: none; border-color: transparent; }

  /* Ajouter un addon */
  #aj-curseforge { justify-content: center; height: 40px; width: 100%; }
  .ajout-liens { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .ajout-liens .case { flex: none; }

  .ajout-autres .btn { justify-content: center; height: 40px; }

  @media (max-width: 860px) {
    .tete { flex-wrap: wrap; padding: 16px 16px 0; }
    .tete .droite { margin-left: 0; width: 100%; align-items: stretch; }
    .tete .bascule { align-self: flex-end; }
    .tete .actions { flex-wrap: wrap; }

    .onglets { margin: 14px 16px 0; }
    main { padding: 16px; }
    .rang, .rang-tete { grid-template-columns: 24px minmax(0, 1fr) 110px 60px; }
    .rang > :nth-child(3), .rang > :nth-child(4), .rang-tete > :nth-child(3), .rang-tete > :nth-child(4) { display: none; }

</style>
</head>
<body>
<header>
  <div class="tete">
    <img src="/icone.svg?i=3" alt="">
    <div class="titre-appli">
      <h1>Forever Addons Manager</h1>

      <label class="bascule" data-info="Afficher en tableau"><i></i>Compact</label>

        <button class="btn" id="b-dossier" data-info="Ouvre le dossier AddOns du jeu dans l'Explorateur">Mon dossier addons</button>

  <nav class="onglets" id="onglets" role="tablist"></nav>

<!-- La barre garde sa saisie et son curseur : rendre() la replace à côté de « Filtrer » sans la recréer. -->
<div hidden id="reserve-recherche">
  <form class="recherche" id="f-recherche" autocomplete="off">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
    <input id="recherche" type="search" placeholder="Rechercher un addon" aria-label="Rechercher dans mes addons">
  </form>

<main id="contenu"><p class="vide">Chargement…</p></main>

<dialog id="d-fiche"><form method="dialog" id="f-fiche"></form></dialog>

    <label>Dossiers dans AddOns (un par ligne) <textarea name="dossiers" rows="3" style="font-family:Consolas,monospace;font-size:12.5px"></textarea></label>
    <div class="pied-fenetre">

<input type="file" id="i-zip" accept=".zip" hidden>
<div id="depot">Lâche le .zip pour l'installer</div>
<div id="toasts"></div>

<script>
const LIBELLES = { a_tester: "À tester", valide: "Validé", rejete: "Rejeté" };
const SOURCES = { curseforge: "CurseForge", github: "GitHub", page: "Page web", local: "Dossier local (perso)", aucune: "Aucune" };
const NOM = "Forever Addons Manager";
const GENRES = ["Interface", "Quêtes", "Carte", "Combat", "Métiers", "Récolte", "Hôtel des ventes", "Sacs", "Confort", "Leveling", "Guilde", "Autre"];
const genreDe = a => GENRES.includes(a.categorie) ? a.categorie : "Autre";
const ONGLETS = [
  ["installes", "Installés"], ["a_tester", "À tester"], ["valide", "Validés"], ["perso", "Mes créations"],
  ["collection", "Toute la collection"], ["maj", "Mises à jour"], ["inconnus", "Non répertoriés"],
];
let ETAT = null;
let onglet = ONGLETS.some(([k]) => k === lireLocal("onglet")) ? lireLocal("onglet") : "installes";
let genre = null;        // filtre par genre (null = tous)
let tri = lireLocal("tri") || "nom";
let sens = lireLocal("sens") === "desc" ? "desc" : "asc";    // asc = A → Z, ou ancien d'abord
let PROGRES = {};        // installations en cours : [id] = { etape, pourcent, mo }
let recherche = "";
let enEdition = null;
let derniereVue = null;   // pour n'animer les cartes qu'au changement de vue
const avisVus = new Set(); // bandeaux déjà montrés (animés une seule fois)

function lireLocal(k) { try { return localStorage.getItem("hamax-" + k); } catch { return null; } }
function ecrireLocal(k, v) { try { localStorage.setItem("hamax-" + k, v); } catch {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

if (lireLocal("compact") === "1" || location.hash === "#compact") document.body.classList.add("compact");
document.querySelector(".bascule").onclick = () => {
  document.body.classList.toggle("compact");
  ecrireLocal("compact", document.body.classList.contains("compact") ? "1" : "0");
};

// Clé de session donnée par l'appli dans l'adresse de la fenêtre (après le « # », jamais envoyée sur le réseau)
const CLE = new URLSearchParams(location.hash.slice(1)).get("cle") || "";

async function api(chemin, corps, zip) {
  const opts = corps === undefined ? { headers: { "X-Hamax": CLE } } : {
    method: "POST",
    headers: { "X-Hamax": CLE, "Content-Type": zip ? "application/zip" : "application/json" },
    body: zip ? corps : JSON.stringify(corps),
  };
  const r = await fetch(chemin, opts);
  const d = await r.json().catch(() => ({ erreur: "Réponse illisible du serveur" }));
  if (!r.ok) throw new Error(d.erreur || ("Erreur " + r.status));
  return d;
}

function toast(texte, type = "ok", duree = 5000) {
  const el = document.createElement("div");
  el.className = "toast " + (type === "ok" ? "" : type);
  el.textContent = texte;
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), type === "erreur" ? duree * 2 : duree);
}

// Message qui reste affiché tant que l'action dure : toast() le remplace une fois le résultat connu.
function activite(texte) {
  const el = document.createElement("div");
  el.className = "toast encours";
  el.setAttribute("role", "status");
  const libelle = el.appendChild(document.createElement("span"));
  libelle.textContent = texte;
  document.getElementById("toasts").append(el);
  return { texte: t => { libelle.textContent = t; }, fin: () => el.remove() };
}
async function enCours(texte, fn) {
  const a = activite(texte);
  try { return await fn(a); }
  finally { a.fin(); }
}

async function occupe(bouton, fn) {
  const avant = bouton?.innerHTML;   // innerHTML : garde l'icône du bouton (Jouer)
  if (bouton) { bouton.disabled = true; bouton.textContent = "…"; }
  try { return await fn(); }
  catch (e) { toast(e.message, "erreur"); }
  finally { if (bouton) { bouton.disabled = false; bouton.innerHTML = avant; } }
}

async function charger() {
  let confirmer = [];
  try {
    ETAT = await api("/api/etat");
    for (const ev of ETAT.evenements || []) {
      if (ev.type === "confirmer") confirmer.push(ev);
      else toast(ev.texte, ev.type === "erreur" ? "erreur" : "ok");
    }
  }
  catch (e) { document.getElementById("contenu").innerHTML = `<p class="vide">L'appli ne répond pas : ${esc(e.message)}</p>`; return; }
  rendre();
  for (const ev of confirmer) await installerDepuisLien(ev);
}

// Bouton « Install » du site CurseForge : n'importe quel site peut ouvrir ce lien, donc rien ne s'installe sans ton accord.
async function installerDepuisLien(ev) {
  const quoi = ev.nom ? `« ${ev.nom} »` : `l'addon CurseForge n° ${ev.projet}`;
  if (!confirm(`Installer ${quoi} depuis CurseForge ?\nSa dernière version pour WoW Forever ira dans « À tester ».`)) return;
  await occupe(null, async () => {
    const r = await enCours(`Installation de ${ev.nom || "l'addon"}…`, () => api("/api/installer-curseforge", { projet: ev.projet }));
    toast(`${r.nom} installé depuis CurseForge, rangé dans « À tester ».`);
    await charger();
  });
}

// --- Données dérivées -------------------------------------------------------------
const aMaj = a => a.installe && a.maj && a.maj.dispo === true;
const distant = a => ["curseforge", "github"].includes(a.source?.type);
const description = a => a.description || a.info?.notes || "";

function lienSource(a) {
  const s = a.source || {};
  const lien = s.type === "curseforge" ? s.url || (s.projet ? `https://www.curseforge.com/projects/${s.projet}` : "")
    : s.type === "github" || s.type === "page" ? s.url : "";
  return /^https?:\/\//i.test(lien || "") ? lien : "";   // l'adresse peut venir du .toc de l'addon
}

// Logo CurseForge, sinon pastille avec les initiales (couleur stable tirée du nom)
function logo(a) {
  // Logo CurseForge, sinon l'icône que l'addon déclare dans son .toc
  const image = a.logo || a.icone;
  if (image) return `<img class="logo ${a.logo ? "" : "logo-toc"}" src="${esc(image)}" alt="" loading="lazy">`;
  let h = 0;
  for (const c of a.nom) h = (h * 31 + c.charCodeAt(0)) % 360;
  const init = a.nom.split(/[\s_-]+/).filter(Boolean).map(m => m[0]).join("").slice(0, 2).toUpperCase();
  return `<div class="logo logo-txt" style="background:hsl(${h} 38% 34%)">${esc(init)}</div>`;
}

// « Lueur-1.4.0.zip », « v1.4.10-forever » -> « 1.4.0 », « 1.4.10 » (nom de fichier CurseForge -> numéro)
const numero = v => (String(v || "").match(/\d+(?:\.\d+)+[a-z]?|\d+/) || [v || ""])[0];

// Version affichée + état / action à droite
function version(a) {
  const v = a.info?.version;
  if (aMaj(a)) return `${esc(v || "?")} → <b>${esc(numero(a.maj.version))}</b>`;
  if (!a.installe) return a.maj?.version && !a.maj.erreur ? `dispo ${esc(numero(a.maj.version))}` : "";
  return esc(v || "");
}

function texteProgres(p) {
  if (p.etape === "attente") return "En attente…";
  if (p.etape === "installation") return "Installation…";
  return p.pourcent === null ? `Téléchargement ${String(p.mo).replace(".", ",")} Mo` : `Téléchargement ${p.pourcent} %`;
}
const barreProgres = (id, p) => `<span class="progres" data-progres="${esc(id)}"><i style="width:${p.pourcent ?? 0}%"></i><span>${texteProgres(p)}</span></span>`;

// Le bouton d'action d'un addon, ou la barre s'il s'installe
function actionAddon(a) {
  const cls = "btn petit";
  if (PROGRES[a.id]) return barreProgres(a.id, PROGRES[a.id]);
  if (!a.installe && !a.perso && !(distant(a) && a.source?.projet)) return `<button class="${cls}" data-act="chercher">Chercher</button>`;
  if (aMaj(a)) return `<button class="${cls} or" data-act="installer">Mettre à jour</button>`;
  if (!a.installe && a.source?.type === "local") return `<button class="${cls}" data-act="lier">Installer</button>`;
  if (!a.installe && distant(a)) return `<button class="${cls} or" data-act="installer">Installer</button>`;
  return "";
}

// Où en est l'addon, affiché à côté de son numéro de version
function etat(a) {
  if (PROGRES[a.id] || aMaj(a)) return "";
  if (!a.installe) return `<span class="doux">Pas installé</span>`;
  if (a.maj?.erreur) return `<span class="err" title="${esc(a.maj.erreur)}">Vérif. impossible</span>`;
  if (a.incompatibles?.length) return `<span class="attention" title="Pas de fichier .toc pour WoW Forever : ${esc(a.incompatibles.join(", "))}">⚠ Pas fait pour Forever</span>`;
  if (distant(a)) return a.maj ? `<span class="ok">À jour</span>` : `<span class="doux">Non vérifié</span>`;
  return `<span class="ok">Installé</span>`;
}

const ligneVersion = a => [version(a) && `<span class="ver">${version(a)}</span>`, etat(a)].filter(Boolean).join(`<span class="sep">·</span>`);

function correspond(a) {
  if (onglet === "maj" && !aMaj(a)) return false;
  if (onglet === "installes" && !a.installe) return false;
  if (onglet === "perso" && !a.perso) return false;
  if (["a_tester", "valide"].includes(onglet) && a.statut !== onglet) return false;
  if (!recherche) return true;
  return [a.nom, a.categorie, description(a), a.notes, ...(a.dossiers || [])].join(" ").toLowerCase().includes(recherche);
}

// --- Rendu ---------------------------------------------------------------------
function rendreOnglets() {
  const compte = {
    installes: ETAT.addons.filter(a => a.installe).length,
    collection: ETAT.addons.length,
    maj: ETAT.addons.filter(aMaj).length,
    inconnus: ETAT.inconnus.length,
  };
  for (const s of ETAT.statuts) compte[s] = ETAT.addons.filter(a => a.statut === s).length;
  compte.perso = ETAT.addons.filter(a => a.perso).length;
  const el = document.getElementById("onglets");
  el.innerHTML = ONGLETS
    .filter(([k]) => !(["inconnus", "maj"].includes(k) && !compte[k]))
    .map(([k, l]) => `<button role="tab" data-o="${k}" aria-selected="${onglet === k}">${l}<span class="n ${k === "maj" && compte.maj ? "maj" : ""}">${compte[k] ?? 0}</span></button>`).join("")
    // Pas un vrai onglet : ouvre la recherche du site CurseForge (filtre WoW Forever) dans le navigateur
    + `<button class="externe" id="o-rechercher" title="Chercher un addon sur CurseForge (s'ouvre dans le navigateur)">Rechercher <span aria-hidden="true">↗</span></button>`;
  el.querySelectorAll("button[data-o]").forEach(b => b.onclick = () => { onglet = b.dataset.o; ecrireLocal("onglet", onglet); rendre(); });
  document.getElementById("o-rechercher").onclick = () => ouvrirCurseForge();
}

const STYLO = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 16.5l.8-3.6L13.6 4a1.6 1.6 0 0 1 2.3 0l.4.4a1.6 1.6 0 0 1 0 2.3l-8.9 8.9z"/></svg>`;

function carte(a) {
  return `<article class="carte ${a.installe ? "" : "absent"}" data-id="${esc(a.id)}">
    <div class="haut">${logo(a)}<div class="titres">
      <h3>${esc(a.nom)}</h3>
      <div class="cat">${esc(genreDe(a))}</div>
      <div class="pastilles"><button class="pastille st-${a.statut}" data-act="statut" title="Changer le statut">${LIBELLES[a.statut]}</button>${a.perso ? `<span class="pastille st-perso">Ma création</span>` : ""}</div>
    </div></div>
    <p>${esc(description(a)) || `<span class="doux">Pas de description.</span>`}</p>
    <button class="note-zone ${a.notes ? "pleine" : ""}" data-act="note">${STYLO}<span>${esc(a.notes) || "Ajouter une note"}</span></button>
    <div class="pied"><span class="etat-ligne">${ligneVersion(a)}</span><span class="droite">${actionAddon(a)}<button class="points" data-act="menu" title="Actions">⋯</button></span></div>
  </article>`;
}

function rang(a) {
  return `<div class="rang ${a.installe ? "" : "absent"}" data-id="${esc(a.id)}">${logo(a)}
    <div class="nom"><b>${esc(a.nom)}</b><span class="${a.notes ? "note-texte" : ""}">${esc(a.notes || description(a))}</span></div>
    <span class="st-${a.statut}">${LIBELLES[a.statut]}</span>
    <span class="etat-ligne">${ligneVersion(a)}</span>
    <span class="etat">${actionAddon(a)}</span>
    <span class="rang-fin"><button class="points" data-act="menu" title="Actions">⋯</button></span>
  </div>`;
}

function carteInconnue(g) {
  const a = { nom: g.info.titre || g.dossier };
  return `<article class="carte" data-inconnu="${esc(g.dossier)}">
    <div class="haut">${logo(a)}<div style="min-width:0"><h3>${esc(a.nom)}</h3><div class="cat">${esc(g.dossiers.length > 1 ? g.dossiers.length + " dossiers" : g.dossier)}</div></div></div>
    <p>${esc(g.info.notes || "")}</p>
    <div class="pied"><span class="ver">${esc(g.info.version || "")}</span><span class="droite"><button class="btn petit or" data-act="ajouter-inconnu">Ajouter à ma collection</button></span></div>
  </article>`;
}

function rendre() {
  document.getElementById("chemin").textContent = ETAT.dossier_ok ? ETAT.config.dossier_addons : "Jeu pas encore trouvé";
  document.getElementById("b-jeu").textContent = ETAT.jeu_confirme && ETAT.dossier_ok ? "Localiser" : "Analyser";
  document.getElementById("b-version").textContent = "v" + ETAT.version;
  rendreOnglets();

  let html = "";
  if (!ETAT.dossier_ok) html += `<div class="alerte">L'appli ne trouve pas WoW Forever : clique sur <b>Analyser</b> sous le titre.</div>`;
  // Animations : les cartes arrivent à l'ouverture ou au changement de vue, un bandeau seulement la première fois qu'il paraît
  const vue = [onglet, genre, recherche].join("|");
  const entree = vue !== derniereVue ? " entree" : "";
  derniereVue = vue;
  const avis = cle => { const neuf = !avisVus.has(cle); avisVus.add(cle); return neuf ? "avis nouveau" : "avis"; };
  if (ETAT.maj_appli) {
    html += `<div class="${avis("appli " + ETAT.maj_appli.version)}"><span><b>${NOM} ${esc(ETAT.maj_appli.version)}</b> est disponible.</span><button class="btn petit avis-premier" id="b-notes-appli">Nouveautés</button><button class="btn or petit" id="b-maj-appli">Mettre à jour l'appli</button></div>`;
  }
  if (ETAT.guilde && ETAT.dossier_ok) {
    const g = ETAT.guilde;
    html += `<div class="${avis("guilde " + g.installe)}"><span><b>${esc(g.nom)}</b>, l'addon de la guilde, ${g.installe ? "n'est pas relié à ses mises à jour." : "n'est pas encore installé."}</span><button class="btn or petit" id="b-guilde">${g.installe ? "Activer les mises à jour" : "Installer"}</button></div>`;
  }
  const maj = ETAT.addons.filter(aMaj);
  if (maj.length && onglet !== "inconnus") {
    html += `<div class="${avis("addons " + maj.map(a => a.id + a.maj.version).join(","))}"><span>${maj.length === 1 ? `<b>${esc(maj[0].nom)}</b> peut passer en ${esc(maj[0].maj.version)}` : `<b>${maj.length} mises à jour</b> : ${esc(maj.map(a => a.nom).join(", "))}`}</span><button class="btn or petit" id="b-tout">Tout mettre à jour</button></div>`;
  }

  if (onglet === "inconnus") {
    const liste = ETAT.inconnus.filter(g => !recherche || g.dossiers.join(" ").toLowerCase().includes(recherche));
    html += `<p class="aide" style="margin-bottom:14px">Ces dossiers sont dans AddOns, mais sans fichier .toc : ils ne ressemblent pas à des addons.</p>`;
    html += liste.length ? `<div class="grille" style="display:grid">${liste.map(carteInconnue).join("")}</div>` : `<p class="vide">Rien ici.</p>`;
  } else {
    const dansOnglet = ETAT.addons.filter(correspond);
    const genres = GENRES.filter(g => dansOnglet.some(a => genreDe(a) === g));
    if (!genres.includes(genre)) genre = null;
    const dateMaj = a => a.fichier_installe?.date || "";
    const parNom = (x, y) => x.nom.localeCompare(y.nom, "fr");
    const ordre = {
      nom: parNom,
      ajout: (x, y) => (x.ajoute_le || "").localeCompare(y.ajoute_le || "") || parNom(x, y),
      maj: (x, y) => dateMaj(x).localeCompare(dateMaj(y)) || parNom(x, y),
      installe: (x, y) => (y.installe - x.installe) || parNom(x, y),
    }[tri] || parNom;
    const signe = sens === "asc" ? 1 : -1;
    const liste = dansOnglet.filter(a => !genre || genreDe(a) === genre).sort((x, y) => (aMaj(y) - aMaj(x)) || signe * ordre(x, y));
    const libelleSens = sens === "asc" ? "↑ Croissant" : "↓ Décroissant";
    if (dansOnglet.length || recherche) html += `<div class="filtres">
      <button class="btn petit" id="b-filtre"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 4h14l-5.5 6.5V16l-3-1.5v-4z"/></svg>Filtrer</button>
      <span id="place-recherche"></span>
      ${genre ? `<button class="btn petit genre-actif" data-genre="" title="Retirer ce filtre">${esc(genre)} ✕</button>` : ""}
      <label class="tri">Trier par <select id="tri">
        <option value="nom" ${tri === "nom" ? "selected" : ""}>Nom</option>
        <option value="ajout" ${tri === "ajout" ? "selected" : ""}>Date d'ajout</option>
        <option value="maj" ${tri === "maj" ? "selected" : ""}>Dernière mise à jour</option>
        <option value="installe" ${tri === "installe" ? "selected" : ""}>Installé / pas installé</option>
      </select></label>
      <button class="btn petit" id="b-sens" title="Inverser l'ordre">${libelleSens}</button></div>`;
    if (!liste.length) html += `<p class="vide">${recherche ? "Rien dans ta collection à ce nom." : onglet === "a_tester" ? "Rien à tester : trouve un addon sur CurseForge pour l'installer." : "Rien ici pour l'instant."}</p>`;
    else html += `<div class="grille${entree}">${liste.map(carte).join("")}</div>
      <div class="tableau${entree}"><div class="rang-tete"><span></span><span>Addon</span><span>Statut</span><span>Version</span><span></span><span></span></div>${liste.map(rang).join("")}</div>`;
  }
  const barre = document.getElementById("f-recherche");
  const champ = document.getElementById("recherche");
  const avaitFocus = document.activeElement === champ;
  document.getElementById("reserve-recherche").append(barre);
  document.getElementById("contenu").innerHTML = html;
  document.getElementById("place-recherche")?.replaceWith(barre);
  if (avaitFocus) champ.focus();
  if (entree) document.querySelectorAll("#contenu .grille .carte, #contenu .tableau .rang")
    .forEach((el, i) => el.style.animationDelay = Math.min(i % 40, 14) * 22 + "ms");   // en cascade, plafonnée
  const tout = document.getElementById("b-tout");
  if (tout) tout.onclick = e => toutMettreAJour(e.currentTarget);
}

// --- Menus flottants -------------------------------------------------------------
let menuOuvert = null;
function fermerMenu() { menuOuvert?.remove(); menuOuvert = null; }
function ouvrirMenu(ancre, elements) {
  // Re-cliquer sur le bouton qui a ouvert le menu le referme
  if (menuOuvert?.ancre === ancre) return fermerMenu();
  fermerMenu();
  const m = document.createElement("div");
  m.ancre = ancre;
  m.className = "menu";
  for (const e of elements) {
    if (e === "-") { m.append(document.createElement("hr")); continue; }
    if (e.etiquette) { const d = document.createElement("div"); d.className = "etiquette"; d.textContent = e.etiquette; m.append(d); continue; }
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e.texte;
    if (e.coche !== undefined) b.className = e.coche ? "actif" : "inactif";
    if (e.danger) b.classList.add("danger");
    b.onclick = ev => { ev.stopPropagation(); fermerMenu(); e.action(); };
    m.append(b);
  }
  document.body.append(m);
  const r = ancre.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)) + "px";
  m.style.top = (r.bottom + 4 + mh > innerHeight - 8 ? Math.max(8, r.top - mh - 4) : r.bottom + 4) + "px";
  menuOuvert = m;
}
// Clic ailleurs = on ferme. Le clic qui vient d'ouvrir le menu remonte jusqu'ici : il ne compte pas.
document.addEventListener("click", e => {
  if (menuOuvert && !menuOuvert.contains(e.target) && !menuOuvert.ancre?.contains(e.target)) fermerMenu();
});
addEventListener("keydown", e => { if (e.key === "Escape") fermerMenu(); });
addEventListener("resize", fermerMenu);
document.addEventListener("scroll", fermerMenu, true);

function menuStatut(a, ancre) {
  ouvrirMenu(ancre, ETAT.statuts.map(s => ({ texte: LIBELLES[s], coche: a.statut === s, action: () => actions.statut(a, s) })));
}

function menuAddon(a, ancre) {
  const el = [];
  if (lienSource(a)) el.push({ texte: "Page de l'addon", action: () => window.open(lienSource(a), "_blank") });
  if (a.installe) el.push({ texte: "Ouvrir le dossier", action: () => actions.ouvrir(a) });
  // Répare un addon abîmé même s'il paraît à jour ; un addon relié par un lien n'a rien à retélécharger.
  if (a.installe && !a.perso && distant(a)) {
    el.push({ texte: "Réinstaller", action: () => actions.installer(a) });
  }
  if (el.length) el.push("-");
  el.push({ texte: a.installe ? "Désinstaller" : `Supprimer de ${NOM}`, danger: true, action: () => actions.retirer(a) });
  ouvrirMenu(ancre, el);
}

// --- Actions ---------------------------------------------------------------------
const actions = {
  ouvrir: a => occupe(null, () => api("/api/ouvrir", { id: a.id })),
  installer: a => occupe(null, () => avecProgres([a], async () => {
    const r = await enCours(`Installation de ${a.nom}…`, () => api("/api/installer", { id: a.id }));
    toast(`${r.nom} installé.` + (r.sauvegarde ? "\nL'ancienne version est dans les sauvegardes." : ""));
  })),
  lier: a => occupe(null, async () => { await enCours(`Installation de ${a.nom}…`, () => api("/api/lier", { id: a.id })); toast(`${a.nom} installé.`); await charger(); }),
  statut: (a, s) => occupe(null, async () => { await api("/api/addon", { addon: { ...fiche(a), statut: s }, ancien_id: a.id }); await charger(); }),
  // Propose de désinstaller seulement, ou de supprimer aussi la fiche
  retirer: a => {
    const d = document.getElementById("d-retirer");
    const fin = async (supprimer) => {
      d.close();
      document.getElementById("d-fiche").close();
      await occupe(null, async () => {
        if (a.installe) await api("/api/retirer", { id: a.id });
        if (supprimer) await api("/api/addon/supprimer", { id: a.id });
        toast(supprimer ? `${a.nom} supprimé.` : `${a.nom} désinstallé.`);
        await charger();
      });
    };
    const fichiers = a.info?.lien ? "Ton dossier de développement n'est pas touché." : "Ses fichiers partent dans les sauvegardes : rien n'est effacé.";
    d.querySelector("h3").textContent = a.installe ? `Désinstaller ${a.nom} ?` : `Supprimer ${a.nom} ?`;
    const choix = d.querySelector(".choix");
    choix.innerHTML = (a.installe ? `<button type="button" data-suppr=""><b>Désinstaller</b><span>Il reste dans ta collection avec tes notes. ${fichiers}</span></button>` : "") +
      `<button type="button" data-suppr="1" class="danger"><b>${a.installe ? "Désinstaller et supprimer" : "Supprimer"} de ${NOM}</b><span>Sa fiche et tes notes disparaissent.${a.installe ? " " + fichiers : ""}</span></button>`;
    choix.querySelectorAll("button").forEach(b => b.onclick = () => fin(!!b.dataset.suppr));
    d.showModal();
  },
};

// Affiche une barre sur chaque addon concerné pendant fn(), en suivant l'avancement donné par le serveur
async function avecProgres(addons, fn) {
  for (const a of addons) PROGRES[a.id] = { etape: "attente", pourcent: 0 };
  rendre();
  const suivi = setInterval(async () => {
    const actuel = await api("/api/progression").catch(() => ({}));
    for (const [id, p] of Object.entries(actuel)) {
      PROGRES[id] = p;
      const el = document.querySelector(`[data-progres="${CSS.escape(id)}"]`);
      if (el) { el.querySelector("i").style.width = (p.pourcent ?? 0) + "%"; el.querySelector("span").textContent = texteProgres(p); }
    }
  }, 300);
  try { await fn(); }
  finally {
    clearInterval(suivi);
    for (const a of addons) delete PROGRES[a.id];
    await charger();
  }
}

async function toutMettreAJour(bouton) {
  await occupe(bouton, () => {
    const liste = ETAT.addons.filter(aMaj);
    return avecProgres(liste, () => enCours("Mise à jour des addons…", async suivi => {
      for (const [i, a] of liste.entries()) {
        suivi.texte(`Mise à jour ${i + 1}/${liste.length} : ${a.nom}…`);
        try { await api("/api/installer", { id: a.id }); toast(`${a.nom} mis à jour.`); }
        catch (e) { toast(`${a.nom} : ${e.message}`, "erreur"); }
        delete PROGRES[a.id];
        rendre();
      }
    }));
  });
}

function fiche(a) {
  const { installe, dossiers_trouves, dossiers_manquants, incompatibles, info, maj, ...f } = a;
  return f;
}

document.getElementById("contenu").addEventListener("change", ev => {
  if (ev.target.id === "tri") {
    tri = ev.target.value;
    sens = ["nom", "installe"].includes(tri) ? "asc" : "desc";      // le plus utile d'abord : A → Z, installés, ou le plus récent
    ecrireLocal("tri", tri); ecrireLocal("sens", sens);
    rendre();
  }
});
async function mettreAJourAppli() {
  const bouton = document.getElementById("b-maj-appli");
  if (!confirm(`Installer ${NOM} ${ETAT.maj_appli.version} ?\nL'appli se ferme, se met à jour et se rouvre toute seule. Ta collection et tes notes sont conservées.`)) return;
  bouton.disabled = true;
  const message = activite(`Mise à jour de ${NOM}…`);
  const suivi = setInterval(async () => {
    const p = (await api("/api/progression").catch(() => ({}))).appli;
    if (p) { bouton.textContent = texteProgres(p); message.texte(`Mise à jour de ${NOM} : ${texteProgres(p)}`); }
  }, 300);
  try {
    await api("/api/appli/maj", {});
    bouton.textContent = "Installation…";
    message.texte("Installation… L'appli va se fermer et se rouvrir toute seule.");   // reste affiché jusqu'à la fermeture
  } catch (e) {
    message.fin();
    toast(e.message, "erreur");
    bouton.disabled = false;
    bouton.textContent = "Mettre à jour l'appli";
  }
  clearInterval(suivi);
}

document.getElementById("contenu").addEventListener("click", ev => {
  if (ev.target.closest("#b-maj-appli")) return mettreAJourAppli();
  if (ev.target.closest("#b-guilde")) return occupe(ev.target.closest("#b-guilde"), async () => {
    const r = await enCours(`Installation de ${ETAT.guilde.nom}…`, () => api("/api/installer-guilde", {}));
    toast(`${r.nom} installé. Ses mises à jour te seront proposées comme pour les autres addons.`);
    await charger();
  });
  if (ev.target.closest("#b-notes-appli")) {
    document.getElementById("journal").innerHTML = markdownSimple(`## ${ETAT.maj_appli.version}\n${ETAT.maj_appli.notes}`);
    return document.getElementById("d-changelog").showModal();
  }
  const choix = ev.target.closest("[data-genre]");
  if (choix) { genre = choix.dataset.genre || null; return rendre(); }
  if (ev.target.closest("#b-sens")) { sens = sens === "asc" ? "desc" : "asc"; ecrireLocal("sens", sens); return rendre(); }
  const filtre = ev.target.closest("#b-filtre");
  if (filtre) {
    const dansOnglet = ETAT.addons.filter(correspond);
    const choisir = g => () => { genre = g; rendre(); };
    return ouvrirMenu(filtre, [
      { texte: "Tous les genres", coche: !genre, action: choisir(null) },
      "-",
      ...GENRES.filter(g => dansOnglet.some(a => genreDe(a) === g)).map(g => ({
        texte: `${g} (${dansOnglet.filter(a => genreDe(a) === g).length})`, coche: genre === g, action: choisir(g),
      })),
    ]);
  }
  if (ev.target.closest(".note-champ")) return;
  const el = ev.target.closest("[data-id], [data-inconnu]");
  if (!el) return;
  const bouton = ev.target.closest("[data-act]");
  if (el.dataset.inconnu) {
    if (!bouton) return;
    const g = ETAT.inconnus.find(x => x.dossier === el.dataset.inconnu);
    const id = g.info.curseforge_id;
    return ouvrirEdition(null, {
      nom: g.info.titre || g.dossier, statut: "a_tester", description: g.info.notes || "", dossiers: g.dossiers,
      source: id ? { type: "curseforge", projet: id, url: g.info.site || "" } : { type: g.info.site ? "page" : "aucune", url: g.info.site || "" },
    });
  }
  const a = ETAT.addons.find(x => x.id === el.dataset.id);
  if (!bouton) return ouvrirFiche(a);
  ev.stopPropagation();
  if (bouton.dataset.act === "menu") return menuAddon(a, bouton);
  if (bouton.dataset.act === "statut") return menuStatut(a, bouton);
  if (bouton.dataset.act === "note") return noteRapide(a, el);
  if (bouton.dataset.act === "installer") return actions.installer(a, bouton);
  if (bouton.dataset.act === "lier") return actions.lier(a);
  if (bouton.dataset.act === "chercher") return ouvrirCurseForge(a.nom);
});

// --- Notes ---------------------------------------------------------------------------------
async function enregistrerNote(a, notes) {
  a.notes = notes;
  await api("/api/addon", { addon: { ...fiche(a), notes }, ancien_id: a.id });
}

// Sur la carte, sans ouvrir la fiche : Entrée enregistre, Maj+Entrée va à la ligne, Échap annule
function noteRapide(a, carteEl) {
  if (carteEl.querySelector(".note-champ")) return;
  const champ = document.createElement("textarea");
  champ.className = "note-champ";
  champ.rows = 2;
  champ.value = a.notes || "";
  champ.placeholder = "Ta note… Entrée pour enregistrer";
  carteEl.querySelector(".note-zone").replaceWith(champ);
  champ.focus();
  champ.setSelectionRange(champ.value.length, champ.value.length);
  let fini = false;
  const terminer = enregistrer => occupe(null, async () => {
    if (fini) return;
    fini = true;
    const texte = champ.value.trim();
    if (enregistrer && texte !== (a.notes || "").trim()) { await enregistrerNote(a, texte); await charger(); }
    else rendre();
  });
  champ.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); terminer(true); }
    if (e.key === "Escape") { e.stopPropagation(); terminer(false); }
  };
  champ.onblur = () => terminer(true);
}

// --- Fiche d'un addon ----------------------------------------------------------------
function ouvrirFiche(a) {
  const info = a.info || {};
  const lien = lienSource(a);
  const d = document.getElementById("d-fiche"), f = document.getElementById("f-fiche");
  const date = t => t ? new Date(t.replace(" ", "T")).toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) : "";
  const cases = [
    ["Source", lien ? `<a href="${esc(lien)}" target="_blank" rel="noopener">${esc(SOURCES[a.source?.type])} ${ICONES_FICHE.lien}</a>` : esc(SOURCES[a.source?.type] || "—")],
    distant(a) && ["Canal", { release: "Release", beta: "Bêta", alpha: "Alpha" }[a.source?.canal || "release"]],
    ["Dossiers", (a.dossiers || []).length ? `<span title="${esc(a.dossiers.join("\n"))}">${esc(a.dossiers[0])}${a.dossiers.length > 1 ? ` +${a.dossiers.length - 1}` : ""}</span>` : "—"],
    a.maj?.verifie_le && ["Vérifié", esc(a.maj.verifie_le.slice(8, 10) + "/" + a.maj.verifie_le.slice(5, 7) + " à " + a.maj.verifie_le.slice(11))],
    a.ajoute_le && ["Ajouté le", esc(date(a.ajoute_le))],
    a.source?.projet && ["Projet", esc(a.source.projet)],
  ].filter(Boolean);
  const alertes = [];
  if (a.dossiers_manquants?.length && a.installe) alertes.push(`Dossiers manquants : ${esc(a.dossiers_manquants.join(", "))}`);
  if (a.incompatibles?.length) alertes.push(`Pas de .toc pour WoW Forever : ${esc(a.incompatibles.join(", "))}`);
  const action = actionAddon(a).replace("btn petit", "btn");
  f.innerHTML = `
    <div class="fiche-banniere"><button type="button" class="fiche-x" id="fiche-fermer" aria-label="Fermer">✕</button></div>
    <div class="fiche-tete">
      ${logo(a)}
      <div class="fiche-titres"><h3>${esc(a.nom)}</h3>
        <div class="fiche-puces">
          <span class="puce">${esc(genreDe(a))}</span>
          ${info.auteur ? `<span class="puce">par ${esc(info.auteur)}</span>` : ""}
          ${a.perso ? `<span class="puce st-perso">Ma création</span>` : ""}
          ${ligneVersion(a) ? `<span class="puce etat-ligne">${ligneVersion(a)}</span>` : ""}
        </div>
      </div>
    </div>
    <div class="fiche-corps">
      <div class="fiche-statut" role="group" aria-label="Statut">${ETAT.statuts.map(s => `<button type="button" data-statut="${s}" class="st-${s}" aria-pressed="${a.statut === s}"><i></i>${LIBELLES[s]}</button>`).join("")}</div>
      ${description(a) ? `<p class="fiche-desc">${esc(description(a))}</p>` : ""}
      ${alertes.map(t => `<div class="fiche-alerte">⚠ ${t}</div>`).join("")}
      <div class="fiche-cases">${cases.map(([k, v]) => `<div><small>${k}</small><span>${v}</span></div>`).join("")}</div>
      <label class="fiche-note">${STYLO}<textarea rows="1" id="fiche-notes" placeholder="Ajouter une note : ce que tu en penses, tes réglages…" aria-label="Mes notes">${esc(a.notes || "")}</textarea><span class="note-etat" id="fiche-etat"></span></label>
    </div>
    <div class="fiche-pied">
      <button class="btn discret" type="button" id="fiche-retirer">${ICONES_FICHE.corbeille}${a.installe ? "Désinstaller" : "Supprimer"}</button>
      <span class="espace"></span>
      ${a.installe ? `<button class="btn icone" type="button" id="fiche-dossier" title="Ouvrir son dossier">${ICONES_FICHE.dossier}</button>` : ""}
      ${distant(a) && a.installe && !aMaj(a) ? `<button class="btn" type="button" id="fiche-reinstaller">${ICONES_FICHE.recharger}Réinstaller</button>` : ""}
      <button class="btn" type="button" id="fiche-modifier">${STYLO}Modifier</button>
      ${action}
    </div>`;
  colorerBanniere(f.querySelector(".fiche-banniere"), f.querySelector(".fiche-tete .logo"), a.nom);

  // Notes enregistrées toutes seules : après une pause dans la frappe, et à la fermeture
  const notes = f.querySelector("#fiche-notes"), etatNote = f.querySelector("#fiche-etat");
  const ajuster = () => { notes.style.height = "auto"; notes.style.height = notes.scrollHeight + "px"; };
  notes.addEventListener("input", ajuster);
  let minuteur;
  const sauver = async () => {
    clearTimeout(minuteur);
    const texte = notes.value.trim();
    if (texte === (a.notes || "").trim()) return;
    try { await enregistrerNote(a, texte); etatNote.textContent = "Enregistré"; }
    catch (e) { toast(e.message, "erreur"); }
  };
  notes.oninput = () => { etatNote.textContent = ""; clearTimeout(minuteur); minuteur = setTimeout(sauver, 700); };
  const dossier = f.querySelector("#fiche-dossier");
  if (dossier) dossier.onclick = () => actions.ouvrir(a);
  d.addEventListener("close", () => sauver().then(charger), { once: true });

  f.querySelector("#fiche-fermer").onclick = async () => { await sauver(); d.close(); };
  f.querySelector("#fiche-modifier").onclick = async () => { await sauver(); d.close(); ouvrirEdition(a); };
  f.querySelector("#fiche-retirer").onclick = async () => { await sauver(); actions.retirer(a); };
  f.querySelectorAll("[data-statut]").forEach(b => b.onclick = () => occupe(null, async () => {
    a.statut = b.dataset.statut;
    await api("/api/addon", { addon: fiche(a), ancien_id: a.id });
    f.querySelectorAll("[data-statut]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  const reinstaller = f.querySelector("#fiche-reinstaller");
  if (reinstaller) reinstaller.onclick = () => { d.close(); actions.installer(a); };
  f.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    d.close();
    if (b.dataset.act === "lier") actions.lier(a);
    else if (b.dataset.act === "chercher") ouvrirCurseForge(a.nom);
    else actions.installer(a);
  });
  d.showModal();
  ajuster();
  notes.focus();
  notes.setSelectionRange(notes.value.length, notes.value.length);
}

// Bannière de la fiche aux couleurs du logo (moyenne de ses pixels colorés). Sans image lisible : couleur tirée du nom.
function colorerBanniere(banniere, image, nom) {
  const peindre = (t, s) => banniere.style.setProperty("--teinte", t) || banniere.style.setProperty("--sat", s + "%");
  let h = 0;
  for (const c of nom) h = (h * 31 + c.charCodeAt(0)) % 360;
  peindre(h, 38);
  if (!(image instanceof HTMLImageElement)) return;
  const lire = () => {
    try {
      const c = document.createElement("canvas");
      c.width = c.height = 24;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0, 24, 24);
      const p = ctx.getImageData(0, 0, 24, 24).data;
      let r = 0, g = 0, b = 0, poids = 0;
      for (let i = 0; i < p.length; i += 4) {
        const max = Math.max(p[i], p[i + 1], p[i + 2]), min = Math.min(p[i], p[i + 1], p[i + 2]);
        const w = (p[i + 3] / 255) * ((max - min) / 255 + .05);   // les pixels colorés comptent plus que le gris
        r += p[i] * w; g += p[i + 1] * w; b += p[i + 2] * w; poids += w;
      }
      if (!poids) return;
      [r, g, b] = [r / poids / 255, g / poids / 255, b / poids / 255];
      const max = Math.max(r, g, b), min = Math.min(r, g, b), e = max - min;
      if (e < .06) return peindre(35, 12);   // logo presque gris : bannière neutre et chaude
      const t = max === r ? ((g - b) / e) % 6 : max === g ? (b - r) / e + 2 : (r - g) / e + 4;
      peindre(Math.round((t * 60 + 360) % 360), Math.min(70, Math.round(e * 100 + 25)));
    } catch { /* image d'un autre site sans autorisation : on garde la couleur du nom */ }
  };
  // Les logos CurseForge viennent d'un autre site : on le recharge en demandant l'autorisation de lire ses pixels
  if (image.src.startsWith(location.origin)) image.complete ? lire() : image.addEventListener("load", lire, { once: true });
  else { const copie = new Image(); copie.crossOrigin = "anonymous"; copie.onload = () => { image = copie; lire(); }; copie.src = image.src; }
}

// --- Nouveautés (CHANGELOG.md) ---------------------------------------------------------
function markdownSimple(md) {
  // Titres « ## 1.0.0 — date » et puces « - texte » ; **gras** et `code` dans les puces.
  const ligne = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  let html = "", liste = false;
  for (const l of md.split(/\r?\n/)) {
    const titre = l.match(/^##\s+(\S+)\s*(?:[—-]\s*(.*))?$/);
    if (titre) { if (liste) { html += "</ul>"; liste = false; } html += `<h4>Version ${esc(titre[1])}${titre[2] ? `<small>${esc(titre[2])}</small>` : ""}</h4>`; continue; }
    const puce = l.match(/^\s*[-*]\s+(.*)$/);
    if (puce) { if (!liste) { html += "<ul>"; liste = true; } html += `<li>${ligne(puce[1])}</li>`; }
  }
  return html + (liste ? "</ul>" : "");
}
async function montrerNouveautes() {
  await occupe(null, async () => {
    const r = await api("/api/changelog");
    document.getElementById("journal").innerHTML = markdownSimple(r.texte);
    document.getElementById("d-changelog").showModal();
  });
}
